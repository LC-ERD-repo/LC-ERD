[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcerd-repro"
version = "0.1.0"
description = "A compact LC-ERD reproduction scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
]

[project.optional-dependencies]
hf = [
  "accelerate>=0.30",
  "datasets>=2.19",
  "peft>=0.11",
  "transformers>=4.41",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
